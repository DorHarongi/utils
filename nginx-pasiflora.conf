# Pasiflora - Angular app on port 443 with SSL
# Deployed by CICD to /etc/nginx/sites-available/pasiflora

server {
    listen 443 ssl;
    server_name emperium.hopto.org;

    ssl_certificate /home/ubuntu/Desktop/pasiflora/certs/fullchain.pem;
    ssl_certificate_key /home/ubuntu/Desktop/pasiflora/certs/privkey.pem;

    root /home/ubuntu/Desktop/pasiflora/client/dist/client;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API stays on :3000 - client uses https://emperium.hopto.org:3000 directly
}
