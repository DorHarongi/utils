# Pasiflora - Blue-Green deployment with nginx reverse proxy
# Deployed by CI/CD to /etc/nginx/conf.d/pasiflora.conf

upstream userservice_backend {
    include /etc/nginx/pasiflora-upstream.conf;
}

server {
    listen 443 ssl;
    server_name emperium.hopto.org localhost;

    ssl_certificate /home/ubuntu/Desktop/pasiflora/certs/fullchain.pem;
    ssl_certificate_key /home/ubuntu/Desktop/pasiflora/certs/privkey.pem;

    root /home/ubuntu/Desktop/pasiflora/client/dist/client;
    index index.html;

    # API routes - proxy to userService blue/green backend
    location ~ '^/(health|users|world|attack|reports|relics|announcements|server|messages|bosses|oasis|clans|buildings-upgrading|troops-training|workers|interactions|quests|daily-quests|clan-quests|chat|scouting)(/|$)' {
        proxy_pass http://userservice_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Socket.IO - WebSocket proxy for clan chat
    location /socket.io/ {
        proxy_pass http://userservice_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # Never cache index.html so deploys take effect immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # Long-cache hashed assets (Angular fingerprints filenames)
    location ~* \.[0-9a-f]{16,}\.(js|css|jpg|png|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Angular SPA - catch-all for frontend routes + static files
    location / {
        try_files $uri $uri/ /index.html;
    }
}
