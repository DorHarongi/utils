# Pasiflora - Blue-Green deployment with nginx reverse proxy
# Deployed by CI/CD to /etc/nginx/sites-available/pasiflora

upstream userservice_backend {
    include /etc/nginx/pasiflora-upstream.conf;
}

server {
    listen 443 ssl;
    server_name emperium.hopto.org;

    ssl_certificate /home/ubuntu/Desktop/pasiflora/certs/fullchain.pem;
    ssl_certificate_key /home/ubuntu/Desktop/pasiflora/certs/privkey.pem;

    root /home/ubuntu/Desktop/pasiflora/client/dist/client;
    index index.html;

    # API routes â€” proxy to userService blue/green backend
    # Add new NestJS controller paths here when created
    location ~ ^/(health|users|world|attack|reports|relics|announcements|server|messages|bosses|oasis|clans|buildings-upgrading|troops-training|workers|interactions|quests|daily-quests|clan-quests|chat|scouting)(/|$) {
        proxy_pass http://userservice_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Socket.IO â€” WebSocket proxy for clan chat
    location /socket.io/ {
        proxy_pass http://userservice_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # Angular SPA â€” catch-all for frontend routes + static files
    location / {
        try_files $uri $uri/ /index.html;
    }
}
